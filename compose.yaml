# Optional single-host deployment: Docker/Compose with an HTTPS reverse proxy.
# The Apple container route (see README) needs none of this file.
#
#   1. cp .env.example .env && edit every value
#   2. edit deploy/Caddyfile: replace prompts.example.com
#   3. docker compose up -d --build
#
# The Go server listens on 0.0.0.0 inside the network but is not published to
# the host: only Caddy can reach it, and only Caddy terminates TLS. Because the
# app port is unreachable from outside, Caddy's X-Real-IP can be trusted, and
# compose.yaml sets TRUST_PROXY=true for that reason. Publishing the app port
# (adding a `ports:` entry) would break that assumption.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: prompts-web:local
    restart: unless-stopped
    env_file: .env
    environment:
      # Explicit, so a .env that still carries the local dev defaults cannot
      # silently expose the service on loopback-only or a wrong origin.
      LISTEN_ADDR: 0.0.0.0:8080
      DATA_DIR: /data
      # Only correct because this service publishes no host port: Caddy is the
      # sole route in, and it overwrites X-Real-IP. Publishing the app port as
      # well would let a client forge that header and evade the login throttle.
      TRUST_PROXY: "true"
    volumes:
      - app-data:/data
    # No `ports:` — the proxy is the only way in. TRUST_PROXY depends on this.

  caddy:
    image: docker.io/library/caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    environment:
      # Caddy reads these for ACME account/notifications; email is optional.
      APP_DOMAIN: ${APP_DOMAIN:?set APP_DOMAIN in .env}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  app-data:
  caddy-data:
  caddy-config:
